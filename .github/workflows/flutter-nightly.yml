name: Flutter Nightly Build

# Remotek: niente build notturno automatico, solo manuale (workflow_dispatch).
# Upstream aveva schedule cron "0 0 * * *".
on:
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
